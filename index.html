<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAN MUSIC - Streaming Multimedia Avanzado</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
        .glass { background: rgba(20, 20, 25, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-[#0A0A0C] text-zinc-100 h-screen overflow-hidden flex flex-col select-none">
    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Canciones en tendencia solicitadas precargadas con búsqueda automática
        const TRENDING_TRACKS = [
            { id: 't1', title: "LA VILLA", artist: "Ryan Castro, Kapo & Gangsta", query: "Ryan Castro La Villa" },
            { id: 't2', title: "BAILE INOLVIDABLE", artist: "Bad Bunny", query: "Bad Bunny Baile Inolvidable" },
            { id: 't3', title: "no tiene sentido", artist: "Beéle", query: "Beele no tiene sentido" },
            { id: 't4', title: "DtMF", artist: "Bad Bunny", query: "Bad Bunny DtMF" },
            { id: 't5', title: "Dardos", artist: "Romeo Santos & Prince Royce", query: "Romeo Santos Prince Royce Dardos" },
            { id: 't6', title: "Qué Pasaría...", artist: "Rauw Alejandro & Bad Bunny", query: "Rauw Alejandro Bad Bunny Que Pasaria" },
            { id: 't7', title: "UWAIE", artist: "Kapo", query: "Kapo UWAIE" },
            { id: 't8', title: "COQUETA", artist: "Fuerza Regida & Grupo Frontera", query: "Fuerza Regida Grupo Frontera Coqueta" },
            { id: 't9', title: "La Perla", artist: "ROSALÍA & Yahritza Y Su Esencia", query: "Rosalia La Perla" },
            { id: 't10', title: "Berghain", artist: "ROSALÍA, Björk & Yves Tumor", query: "Rosalia Bjork Berghain" }
        ];

        function App() {
            const [currentTrack, setCurrentTrack] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.8);
            const [isMuted, setIsMuted] = useState(false);
            const [queue, setQueue] = useState([]);
            const [queueIndex, setQueueIndex] = useState(0);
            const [likedTracks, setLikedTracks] = useState([]);
            const [playlists, setPlaylists] = useState([]);
            const [activeTab, setActiveTab] = useState('home'); // home, explore, library, playlist
            const [selectedPlaylist, setSelectedPlaylist] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [searchFilter, setSearchFilter] = useState('all');
            const [trendingSongs, setTrendingSongs] = useState([]);
            const [isShuffle, setIsShuffle] = useState(false);
            const [repeatMode, setRepeatMode] = useState('off'); // off, all, one
            const [showLyrics, setShowLyrics] = useState(false);
            const [showQueuePanel, setShowQueuePanel] = useState(false);
            const [showEqualizer, setShowEqualizer] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1.0);
            const [sleepTimer, setSleepTimer] = useState(null);
            const [eqGains, setEqGains] = useState([0, 0, 0, 0, 0]); // 5 bandas
            const [newPlaylistModal, setNewPlaylistModal] = useState(false);
            const [newPlaylistName, setNewPlaylistName] = useState('');
            const [dynamicBg, setDynamicBg] = useState('#0A0A0C');

            const audioRef = useRef(new Audio());
            const sleepTimerRef = useRef(null);

            // Saludo dinámico según la hora
            const greeting = useMemo(() => {
                const hour = new Date().getHours();
                if (hour < 12) return 'Buenos días';
                if (hour < 18) return 'Buenas tardes';
                return 'Buenas noches';
            }, []);

            // Cargar datos iniciales de la API de iTunes para las canciones en tendencia
            useEffect(() => {
                const loadTrending = async () => {
                    const loaded = [];
                    for (const t of TRENDING_TRACKS) {
                        try {
                            const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(t.query)}&media=music&limit=1`);
                            const data = await res.json();
                            if (data.results && data.results.length > 0) {
                                const item = data.results[0];
                                loaded.push({
                                    id: t.id,
                                    title: t.title || item.trackName,
                                    artist: t.artist || item.artistName,
                                    album: item.collectionName || 'Single',
                                    cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x600bb') : 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80',
                                    previewUrl: item.previewUrl,
                                    duration: item.trackTimeMillis ? Math.floor(item.trackTimeMillis / 1000) : 30
                                });
                            } else {
                                loaded.push({
                                    id: t.id,
                                    title: t.title,
                                    artist: t.artist,
                                    album: 'Single',
                                    cover: 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80',
                                    previewUrl: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3',
                                    duration: 30
                                });
                            }
                        } catch (err) {
                            console.error("Error cargando tendencia", err);
                        }
                    }
                    setTrendingSongs(loaded);
                    if (loaded.length > 0) {
                        setQueue(loaded);
                    }
                };
                loadTrending();

                // Cargar LocalStorage
                const savedLikes = localStorage.getItem('lan_music_likes');
                if (savedLikes) setLikedTracks(JSON.parse(savedLikes));
                const savedPlaylists = localStorage.getItem('lan_music_playlists');
                if (savedPlaylists) setPlaylists(JSON.parse(savedPlaylists));
            }, []);

            // Guardar en LocalStorage
            useEffect(() => {
                localStorage.setItem('lan_music_likes', JSON.stringify(likedTracks));
            }, [likedTracks]);

            useEffect(() => {
                localStorage.setItem('lan_music_playlists', JSON.stringify(playlists));
            }, [playlists]);

            // Control de Audio HTML5
            useEffect(() => {
                const audio = audioRef.current;
                audio.volume = isMuted ? 0 : volume;
                audio.playbackRate = playbackRate;

                const updateTime = () => setCurrentTime(audio.currentTime);
                const updateDuration = () => setDuration(audio.duration || 0);
                const handleEnded = () => {
                    if (repeatMode === 'one') {
                        audio.currentTime = 0;
                        audio.play();
                    } else {
                        handleNext();
                    }
                };

                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', updateDuration);
                audio.addEventListener('ended', handleEnded);

                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', updateDuration);
                    audio.removeEventListener('ended', handleEnded);
                };
            }, [queueIndex, queue, repeatMode, volume, isMuted, playbackRate]);

            // Reproducir canción
            const playTrack = (track, newQueue = null) => {
                if (newQueue) {
                    setQueue(newQueue);
                    const idx = newQueue.findIndex(item => item.id === track.id);
                    setQueueIndex(idx !== -1 ? idx : 0);
                } else {
                    const idx = queue.findIndex(item => item.id === track.id);
                    if (idx !== -1) setQueueIndex(idx);
                    else {
                        setQueue([track, ...queue]);
                        setQueueIndex(0);
                    }
                }
                setCurrentTrack(track);
                setIsPlaying(true);
                audioRef.current.src = track.previewUrl || 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
                audioRef.current.play().catch(e => console.log("Play error:", e));
            };

            const togglePlay = () => {
                if (!currentTrack && queue.length > 0) {
                    playTrack(queue[0]);
                    return;
                }
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play();
                    setIsPlaying(true);
                }
            };

            const handleNext = () => {
                if (queue.length === 0) return;
                let nextIdx;
                if (isShuffle) {
                    nextIdx = Math.floor(Math.random() * queue.length);
                } else {
                    nextIdx = (queueIndex + 1) % queue.length;
                    if (nextIdx === 0 && repeatMode === 'off') {
                        setIsPlaying(false);
                        return;
                    }
                }
                setQueueIndex(nextIdx);
                const nextTrack = queue[nextIdx];
                setCurrentTrack(nextTrack);
                audioRef.current.src = nextTrack.previewUrl;
                if (isPlaying) audioRef.current.play();
            };

            const handlePrev = () => {
                if (queue.length === 0) return;
                const prevIdx = (queueIndex - 1 + queue.length) % queue.length;
                setQueueIndex(prevIdx);
                const prevTrack = queue[prevIdx];
                setCurrentTrack(prevTrack);
                audioRef.current.src = prevTrack.previewUrl;
                if (isPlaying) audioRef.current.play();
            };

            // Búsqueda en tiempo real iTunes API
            useEffect(() => {
                if (!searchQuery.trim()) {
                    setSearchResults([]);
                    return;
                }
                const timer = setTimeout(async () => {
                    try {
                        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(searchQuery)}&media=music&limit=20`);
                        const data = await res.json();
                        const formatted = data.results.map((item, idx) => ({
                            id: `search-${idx}-${item.trackId}`,
                            title: item.trackName,
                            artist: item.artistName,
                            album: item.collectionName || 'Single',
                            cover: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '600x600bb') : 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80',
                            previewUrl: item.previewUrl,
                            duration: item.trackTimeMillis ? Math.floor(item.trackTimeMillis / 1000) : 30
                        }));
                        setSearchResults(formatted);
                    } catch (err) {
                        console.error("Error en búsqueda:", err);
                    }
                }, 400);
                return () => clearTimeout(timer);
            }, [searchQuery]);

            // Atajos de teclado
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    if (e.code === 'Space') {
                        e.preventDefault();
                        togglePlay();
                    } else if (e.code === 'ArrowRight') {
                        audioRef.current.currentTime = Math.min(duration, audioRef.current.currentTime + 5);
                    } else if (e.code === 'ArrowLeft') {
                        audioRef.current.currentTime = Math.max(0, audioRef.current.currentTime - 5);
                    } else if (e.code === 'KeyM') {
                        setIsMuted(!isMuted);
                    } else if (e.code === 'KeyL') {
                        setShowLyrics(!showLyrics);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isPlaying, currentTrack, duration, isMuted, showLyrics]);

            // Crear Playlist
            const createPlaylist = () => {
                if (!newPlaylistName.trim()) return;
                const newPl = {
                    id: 'pl-' + Date.now(),
                    name: newPlaylistName,
                    tracks: []
                };
                setPlaylists([...playlists, newPl]);
                setNewPlaylistName('');
                setNewPlaylistModal(false);
            };

            const toggleLike = (track, e) => {
                e.stopPropagation();
                const exists = likedTracks.some(t => t.id === track.id);
                if (exists) {
                    setLikedTracks(likedTracks.filter(t => t.id !== track.id));
                } else {
                    setLikedTracks([...likedTracks, track]);
                }
            };

            const formatTimeSec = (sec) => {
                if (isNaN(sec)) return "0:00";
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            return (
                <div className="flex h-full w-full overflow-hidden bg-[#0A0A0C]">
                    
                    {/* ZONA 1: BARRA LATERAL IZQUIERDA */}
                    <aside className="w-64 bg-[#0E0E12] border-r border-zinc-800/60 flex flex-col justify-between shrink-0 hidden md:flex">
                        <div className="p-6 flex flex-col gap-6">
                            {/* Logo */}
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-rose-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                                    <svg className="w-6 h-6 text-white animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg tracking-wider bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">LAN MUSIC</h1>
                                    <span className="text-[10px] text-zinc-500 font-semibold tracking-widest uppercase">Streaming Core</span>
                                </div>
                            </div>

                            {/* Navegación Principal */}
                            <nav className="flex flex-col gap-1">
                                <button onClick={() => setActiveTab('home')} className={`flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all ${activeTab === 'home' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30 shadow-sm' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50'}`}>
                                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                                    Inicio
                                </button>
                                <button onClick={() => setActiveTab('explore')} className={`flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all ${activeTab === 'explore' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30 shadow-sm' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50'}`}>
                                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                    Explorar & Buscar
                                </button>
                                <button onClick={() => setActiveTab('library')} className={`flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl font-medium text-sm transition-all ${activeTab === 'library' ? 'bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30 shadow-sm' : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50'}`}>
                                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                                    Tu Biblioteca
                                </button>
                            </nav>

                            {/* Biblioteca / Playlists */}
                            <div className="flex flex-col gap-2 mt-4">
                                <div className="flex items-center justify-between px-2">
                                    <span className="text-xs font-bold uppercase tracking-wider text-zinc-500">Playlists</span>
                                    <button onClick={() => setNewPlaylistModal(true)} className="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition" title="Crear Playlist">
                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                                    </button>
                                </div>
                                <div className="flex flex-col gap-1 overflow-y-auto max-h-48 pr-1">
                                    <button onClick={() => { setActiveTab('liked'); setSelectedPlaylist(null); }} className="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-zinc-400 hover:text-white hover:bg-zinc-800/40 transition text-left">
                                        <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-indigo-500 to-rose-500 flex items-center justify-center text-white shrink-0">
                                            <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                                        </div>
                                        <span className="truncate">Canciones con Like ({likedTracks.length})</span>
                                    </button>
                                    {playlists.map(pl => (
                                        <button key={pl.id} onClick={() => { setActiveTab('playlist'); setSelectedPlaylist(pl); }} className="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-zinc-400 hover:text-white hover:bg-zinc-800/40 transition text-left">
                                            <div className="w-7 h-7 rounded-lg bg-zinc-800 flex items-center justify-center text-zinc-300 font-bold text-xs shrink-0">
                                                {pl.name.charAt(0).toUpperCase()}
                                            </div>
                                            <span className="truncate">{pl.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Footer Sidebar */}
                        <div className="p-4 border-t border-zinc-800/60 bg-[#0B0B0E]">
                            <div className="flex items-center gap-3">
                                <div className="w-9 h-9 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-sm text-white shadow">
                                    BV
                                </div>
                                <div className="overflow-hidden">
                                    <h4 className="text-sm font-semibold truncate text-zinc-200">Bryan Valderrama</h4>
                                    <span className="text-[11px] text-indigo-400 font-medium">Plan Premium LAN</span>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* ZONA 2: ÁREA CENTRAL DINÁMICA */}
                    <main className="flex-1 flex flex-col h-full overflow-hidden relative bg-[#0A0A0C]">
                        {/* Header Superior */}
                        <header className="h-16 px-6 border-b border-zinc-800/60 glass flex items-center justify-between shrink-0 z-20">
                            <div className="flex items-center gap-4 w-full max-w-md">
                                <div className="relative w-full">
                                    <svg className="w-4 h-4 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                    <input 
                                        type="text" 
                                        placeholder="¿Qué te apetece escuchar hoy? (Artistas, canciones...)"
                                        value={searchQuery}
                                        onChange={(e) => { setSearchQuery(e.target.value); if(activeTab !== 'explore') setActiveTab('explore'); }}
                                        className="w-full bg-zinc-900/80 border border-zinc-800 rounded-full pl-10 pr-4 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition"
                                    />
                                </div>
                            </div>

                            <div className="flex items-center gap-3">
                                <button onClick={() => setShowEqualizer(true)} className="p-2.5 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 transition" title="Ecualizador">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/></svg>
                                </button>
                                <button onClick={() => setShowQueuePanel(!showQueuePanel)} className={`p-2.5 rounded-full border text-zinc-300 transition ${showQueuePanel ? 'bg-indigo-600/20 border-indigo-500/50 text-indigo-400' : 'bg-zinc-900 border-zinc-800 hover:bg-zinc-800'}`} title="Cola de reproducción">
                                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
                                </button>
                            </div>
                        </header>

                        {/* Contenido Dinámico con Scroll */}
                        <div className="flex-1 overflow-y-auto p-6 md:p-8 flex gap-6 pb-32">
                            <div className="flex-1 flex flex-col gap-8">
                                
                                {/* VISTA: INICIO */}
                                {activeTab === 'home' && (
                                    <>
                                        {/* Saludo y Banner Principal */}
                                        <div className="flex flex-col gap-4">
                                            <h2 className="text-2xl md:text-3xl font-extrabold text-zinc-100">{greeting}, Bryan</h2>
                                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {trendingSongs.slice(0, 6).map((song) => (
                                                    <div 
                                                        key={song.id} 
                                                        onClick={() => playTrack(song, trendingSongs)}
                                                        className="group flex items-center gap-3 bg-zinc-900/60 hover:bg-zinc-800/80 border border-zinc-800/80 rounded-xl overflow-hidden cursor-pointer transition shadow-md"
                                                    >
                                                        <img src={song.cover} alt={song.title} className="w-16 h-16 object-cover shrink-0" />
                                                        <div className="flex-1 overflow-hidden pr-3">
                                                            <h4 className="font-bold text-sm text-zinc-100 truncate group-hover:text-indigo-400 transition">{song.title}</h4>
                                                            <p className="text-xs text-zinc-400 truncate">{song.artist}</p>
                                                        </div>
                                                        <div className="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center mr-3 opacity-0 group-hover:opacity-100 transition shadow-lg shrink-0">

                                <div className="bg-[#141418] border border-zinc-800 rounded-3xl p-6 w-full max-w-md flex flex-col gap-4 shadow-2xl">
                                    <div className="flex items-center justify-between">
                                        <h3 className="font-bold text-lg text-zinc-100">Crear Nueva Playlist</h3>
                                        <button onClick={() => setNewPlaylistModal(false)} className="text-zinc-400 hover:text-white">
                                            <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                        </button>
                                    </div>
                                    <input 
                                        type="text" 
                                        placeholder="Nombre de la playlist (ej. Mis Favoritas 2026)"
                                        value={newPlaylistName}
                                        onChange={(e) => setNewPlaylistName(e.target.value)}
                                        className="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500"
                                    />
                                    <div className="flex justify-end gap-3 mt-2">
                                        <button onClick={() => setNewPlaylistModal(false)} className="px-4 py-2 rounded-xl bg-zinc-800 text-zinc-300 text-xs font-semibold hover:bg-zinc-700 transition">Cancelar</button>
                                        <button onClick={createPlaylist} className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">Crear Playlist</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL: ECUALIZADOR DE 5 BANDAS */}
                        {showEqualizer && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-[#141418] border border-zinc-800 rounded-3xl p-6 w-full max-w-md flex flex-col gap-6 shadow-2xl">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-lg text-zinc-100">Ecualizador Gráfico</h3>
                                            <p className="text-xs text-zinc-400">Ajuste de 5 bandas profesionales</p>
                                        </div>
                                        <button onClick={() => setShowEqualizer(false)} className="text-zinc-400 hover:text-white">
                                            <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-5 gap-4 py-4">
                                        {['60Hz', '230Hz', '1kHz', '4kHz', '14kHz'].map((band, idx) => (
                                            <div key={idx} className="flex flex-col items-center gap-3">
                                                <span className="text-[10px] font-bold text-zinc-400">{eqGains[idx]}dB</span>
                                                <input 
                                                    type="range" 
                                                    min="-12" 
                                                    max="12" 
                                                    value={eqGains[idx]}
                                                    onChange={(e) => {
                                                        const val = parseInt(e.target.value);
                                                        const newGains = [...eqGains];
                                                        newGains[idx] = val;
                                                        setEqGains(newGains);
                                                    }}
                                                    className="h-32 accent-indigo-500 cursor-pointer"
                                                    style={{ writingMode: 'vertical-lr', direction: 'rtl' }}
                                                />
                                                <span className="text-[10px] text-zinc-500 font-semibold">{band}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex justify-between items-center pt-2 border-t border-zinc-800">
                                        <button onClick={() => setEqGains([0,0,0,0,0])} className="text-xs text-zinc-400 hover:text-white font-medium">Restablecer</button>
                                        <button onClick={() => setShowEqualizer(false)} className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500 transition shadow">Aplicar</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL: LETRAS EN TIEMPO REAL */}
                        {showLyrics && (
                            <div className="fixed inset-0 bg-black/90 backdrop-blur-xl z-50 flex flex-col p-6 md:p-12">
                                <div className="flex items-center justify-between pb-6 border-b border-zinc-800">
                                    <div className="flex items-center gap-4">
                                        {currentTrack && <img src={currentTrack.cover} alt="" className="w-12 h-12 rounded-xl object-cover" />}
                                        <div>
                                            <h3 className="font-bold text-lg text-zinc-100">{currentTrack?.title || 'Sin reproducción'}</h3>
                                            <p className="text-xs text-zinc-400">{currentTrack?.artist || 'LAN MUSIC'}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowLyrics(false)} className="p-2 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300 hover:text-white">
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                                <div className="flex-1 flex flex-col items-center justify-center text-center p-8 overflow-y-auto gap-8">
                                    <p className="text-2xl md:text-3xl font-bold text-zinc-400 opacity-60">♪ Reproduciendo audio en streaming directo ♪</p>
                                    <p className="text-3xl md:text-5xl font-extrabold text-white leading-tight">
                                        {currentTrack ? `Disfrutando de ${currentTrack.title}` : 'Selecciona una canción para ver la letra sincronizada'}
                                    </p>
                                    <p className="text-lg text-indigo-400 font-semibold">{currentTrack?.artist}</p>
                                </div>
                            </div>
                        )}

                    </main>

                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
