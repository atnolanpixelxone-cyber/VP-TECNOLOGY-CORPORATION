<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VP Music | Reproductor Sin Anuncios</title>
    <style>
        :root {
            --bg-black: #000000;
            --bg-surface: #161617;
            --bg-card: rgba(28, 28, 30, 0.75);
            --border-subtle: rgba(255, 255, 255, 0.12);
            --accent-pink: #fa243c;
            --accent-blue: #2997ff;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Fondo ambiental dinámico */
        .ambient-bg {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 30% 30%, rgba(250, 36, 60, 0.18), transparent 45%),
                        radial-gradient(circle at 75% 70%, rgba(41, 151, 255, 0.15), transparent 45%);
            z-index: -1;
            filter: blur(60px);
            animation: pulseAmbient 12s ease-in-out infinite alternate;
        }

        @keyframes pulseAmbient {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Barra Superior */
        header {
            height: 56px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge-adfree {
            font-size: 0.7rem;
            background: rgba(250, 36, 60, 0.15);
            color: var(--accent-pink);
            border: 1px solid rgba(250, 36, 60, 0.3);
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .upload-btn {
            background: var(--text-main);
            color: var(--bg-black);
            border: none;
            padding: 7px 14px;
            border-radius: 980px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .upload-btn:hover {
            opacity: 0.9;
            transform: scale(1.03);
        }

        /* Contenedor Principal */
        .player-wrapper {
            flex: 1;
            max-width: 1050px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 30px;
            align-items: center;
        }

        /* Panel Izquierdo: Reproductor Activo */
        .now-playing-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-subtle);
            border-radius: 32px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .album-art-container {
            width: 240px;
            height: 240px;
            margin: 0 auto 25px auto;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .album-art-container.playing {
            transform: scale(1.04);
        }

        .album-art-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .track-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 1rem;
            color: var(--accent-pink);
            margin-bottom: 22px;
            font-weight: 500;
        }

        /* Barra de Progreso */
        .progress-area {
            margin-bottom: 22px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 99px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--text-main);
            border-radius: 99px;
            transition: width 0.1s linear;
        }

        .time-stamps {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Controles de Reproducción */
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 24px;
            margin-bottom: 22px;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            opacity: 0.85;
            transition: transform 0.2s ease, opacity 0.2s ease, color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ctrl-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .ctrl-btn.active {
            color: var(--accent-pink);
            opacity: 1;
        }

        .play-pause-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--text-main);
            color: var(--bg-black);
            opacity: 1;
        }

        .play-pause-btn:hover {
            transform: scale(1.07);
        }

        /* Volumen */
        .volume-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 99px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--text-main);
            cursor: pointer;
        }

        /* Panel Derecho: Lista de Reproducción */
        .playlist-card {
            background: var(--bg-card);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--border-subtle);
            border-radius: 32px;
            padding: 30px;
            height: 520px;
            display: flex;
            flex-direction: column;
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .playlist-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .track-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .playlist-items {
            overflow-y: auto;
            flex: 1;
            padding-right: 6px;
        }

        .playlist-items::-webkit-scrollbar {
            width: 5px;
        }

        .playlist-items::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 99px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 6px;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .song-item.active {
            background: rgba(250, 36, 60, 0.16);
        }

        .song-info {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .song-thumb {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
        }

        .song-meta {
            overflow: hidden;
        }

        .song-meta h4 {
            font-size: 0.95rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-item.active .song-meta h4 {
            color: var(--accent-pink);
            font-weight: 600;
        }

        .song-meta p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Ecualizador animado */
        .equalizer {
            display: none;
            align-items: flex-end;
            gap: 3px;
            height: 16px;
        }

        .song-item.active.playing .equalizer {
            display: flex;
        }

        .bar {
            width: 3px;
            background: var(--accent-pink);
            border-radius: 2px;
            animation: eq 0.8s ease-in-out infinite alternate;
        }

        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes eq {
            0% { height: 4px; }
            100% { height: 16px; }
        }

        @media (max-width: 850px) {
            .player-wrapper {
                grid-template-columns: 1fr;
                margin: 20px auto;
            }
            .playlist-card {
                height: 380px;
            }
            .album-art-container {
                width: 190px;
                height: 190px;
            }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <header>
        <div class="brand">
            <span>VP Music</span>
            <span class="badge-adfree">Sin Anuncios</span>
        </div>
        <div>
            <input type="file" id="file-input" accept="audio/*" multiple hidden>
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">+ Cargar Música</button>
        </div>
    </header>

    <main class="player-wrapper">
        <!-- Reproductor Principal -->
        <section class="now-playing-card">
            <div class="album-art-container" id="art-container">
                <img id="cover-img" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80" alt="Portada">
            </div>

            <h1 class="track-title" id="track-title">Selecciona una canción</h1>
            <p class="track-artist" id="track-artist">VP Audio Engine</p>

            <div class="progress-area">
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="time-stamps">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" id="shuffle-btn" title="Aleatorio">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                </button>

                <button class="ctrl-btn" id="prev-btn" title="Anterior">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg>
                </button>

                <button class="ctrl-btn play-pause-btn" id="play-btn" title="Reproducir / Pausar">
                    <svg id="play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>
                    <svg id="pause-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>

                <button class="ctrl-btn" id="next-btn" title="Siguiente">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg>
                </button>

                <button class="ctrl-btn" id="repeat-btn" title="Repetir">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
                </button>
            </div>

            <div class="volume-row">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.85">
            </div>
        </section>

        <!-- Lista de Reproducción -->
        <section class="playlist-card">
            <div class="playlist-header">
                <h2>Cola de Reproducción</h2>
                <span class="track-count" id="track-count">4 pistas</span>
            </div>
            <div class="playlist-items" id="playlist-container"></div>
        </section>
    </main>

    <audio id="audio-player"></audio>

    <script>
        const defaultTracks = [
            {
                title: "Neon Horizon",
                artist: "Synthwave Collective",
                cover: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=600&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                title: "Midnight Focus",
                artist: "Ambient Waves",
                cover: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=600&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                title: "Digital Pulse",
                artist: "Electronic Studio",
                cover: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            },
            {
                title: "Deep Atmosphere",
                artist: "Lo-Fi Lab",
                cover: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=600&q=80",
                src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"
            }
        ];

        let tracks = [...defaultTracks];
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume-slider');
        const playlistContainer = document.getElementById('playlist-container');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const coverImg = document.getElementById('cover-img');
        const artContainer = document.getElementById('art-container');
        const trackCount = document.getElementById('track-count');
        const fileInput = document.getElementById('file-input');

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            trackCount.textContent = `${tracks.length} ${tracks.length === 1 ? 'pista' : 'pistas'}`;

            tracks.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `song-item ${idx === currentIndex ? 'active' : ''} ${idx === currentIndex && isPlaying ? 'playing' : ''}`;
                item.innerHTML = `
                    <div class="song-info">
                        <img src="${track.cover}" class="song-thumb" alt="Cover">
                        <div class="song-meta">
                            <h4>${track.title}</h4>
                            <p>${track.artist}</p>
                        </div>
                    </div>
                    <div class="equalizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                `;
                item.addEventListener('click', () => {
                    loadTrack(idx);
                    playTrack();
                });
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index) {
            currentIndex = index;
            const track = tracks[currentIndex];
            audio.src = track.src;
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            coverImg.src = track.cover;
            renderPlaylist();
        }

        function playTrack() {
            audio.play();
            isPlaying = true;
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            artContainer.classList.add('playing');
            renderPlaylist();
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            artContainer.classList.remove('playing');
            renderPlaylist();
        }

        playBtn.addEventListener('click', () => {
            isPlaying ? pauseTrack() : playTrack();
        });

        nextBtn.addEventListener('click', () => {
            if (isShuffle) {
                currentIndex = Math.floor(Math.random() * tracks.length);
            } else {
                currentIndex = (currentIndex + 1) % tracks.length;
            }
            loadTrack(currentIndex);
            playTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentIndex);
            playTrack();
        });

        shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        });

        repeatBtn.addEventListener('click', () => {
            isRepeat = !isRepeat;
            repeatBtn.classList.toggle('active', isRepeat);
        });

        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                playTrack();
            } else {
                nextBtn.click();
            }
        });

        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            audio.currentTime = (clickX / width) * audio.duration;
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        // Cargar archivos locales desde el dispositivo
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const newTracks = files.map(file => ({
                title: file.name.replace(/\.[^/.]+$/, ""),
                artist: "Archivo Local",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=600&q=80",
                src: URL.createObjectURL(file)
            }));

            tracks = [...newTracks, ...tracks];
            loadTrack(0);
            playTrack();
        });

        // Inicializar
        audio.volume = 0.85;
        loadTrack(0);
    </script>
</body>
</html>
